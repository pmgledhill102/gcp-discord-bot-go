[package]
name = "bench-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.12.2"
ed25519-dalek = "3.0.0"
google-cloud-pubsub = "1.8.0"
hex = "0.4.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
