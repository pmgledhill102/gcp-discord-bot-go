# Builds one benchmark image. Driven by build.sh, which sets the substitutions.
steps:
  - name: gcr.io/cloud-builders/docker
    # BuildKit, for `FROM --platform=$BUILDPLATFORM` in the repository's own
    # Dockerfile; the legacy builder cannot parse it.
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', '${_DOCKERFILE}', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
