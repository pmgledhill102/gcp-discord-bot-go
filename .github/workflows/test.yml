name: "Test with Emulator"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-with-pubsub:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PUBSUB_PROJECT_ID: test-project-id
      PUBSUB_EMULATOR_HOST: localhost:8085

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        # No credentials needed for emulator interaction

      # NOTE: the emulator is started here with `docker run` rather than as a
      # `services:` container. A service container's `options:` are passed to
      # `docker create` as flags, not as the container command, so the emulator
      # arguments were being parsed as an image name ("beta") and the job failed
      # before it ever ran. Service containers cannot override a command, so the
      # emulator has to be launched explicitly.
      - name: Start Pub/Sub emulator
        run: |
          docker run -d --name pubsub-emulator -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/cloud-sdk:emulators \
            gcloud beta emulators pubsub start \
              --project=test-project-id \
              --host-port=0.0.0.0:8085

      - name: Wait for Pub/Sub emulator
        run: |
          echo "Waiting for Pub/Sub emulator..."
          # Uses bash's /dev/tcp rather than nc, so the check needs nothing installed.
          timeout 60s bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/8085) 2>/dev/null; do sleep 1; done' \
            || { echo "Emulator did not start in time"; docker logs pubsub-emulator; exit 1; }
          echo "Emulator ready!"

      - name: Configure gcloud CLI to use the emulator
        run: |
          gcloud config set project test-project-id
          gcloud config set api_endpoint_overrides/pubsub http://localhost:8085/

      - name: Interact with Pub/Sub Emulator using gcloud CLI
        run: |
          echo "Creating topic..."
          gcloud pubsub topics create test-topic --project=test-project-id

          echo "Listing topics..."
          gcloud pubsub topics list --project=test-project-id

          echo "Publishing message..."
          gcloud pubsub topics publish test-topic --message "Hello Emulator!" --project=test-project-id

      - name: Run Application Tests
        env:
          PUBLIC_SIG_KEY: key
          PUBSUB_TOPIC_NAME: test-topic
        run: go test ./...

      - name: Emulator logs
        if: always()
        run: docker logs pubsub-emulator || true

      - name: Stop Pub/Sub emulator
        if: always()
        run: docker rm -f pubsub-emulator || true
