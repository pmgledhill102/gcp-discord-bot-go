version: 2
updates:
# Dependabot pull requests are authored by app/dependabot, so they match none of
# the GitHub mobile app's filters -- not "Created by me", not "Review
# requested". Assigning them puts them in "Assigned to me", a near-default view
# rather than a search string the app does not save.
#
# `reviewers` would have been the more natural key and no longer exists: GitHub
# removed it from the Dependabot options reference. `assignees` remains, and
# covers security updates as well as version updates.
#
# This does not gate auto-merge. Assignment is metadata, so patch and minor
# bumps still land themselves and disappear; what stays visible is whatever did
# NOT merge, which is the case worth seeing (paul-context#160).
  # Enable updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "pmgledhill102"

  # Enable updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "pmgledhill102"

  # Enable updates for the Dockerfile's base images. The builder stage is a
  # version tag Dependabot can bump; the distroless runtime is not -- its Debian
  # release is part of the repository name rather than the tag, so a move to
  # static-debian13 stays a deliberate edit.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "pmgledhill102"
