repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.2.0
    hooks:
      - id: cspell
        types_or: [markdown, plain-text, yaml]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # All three hooks come from the one golangci-lint binary, so the hook and CI
  # can never run different versions. config-verify is not redundant with run:
  # `run` tolerates a config that `config verify` rejects, and CI verifies
  # first -- so without this hook a config can pass locally and fail CI.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint
      # Runs the `formatters:` block (gofmt/goimports). Replaces any separate
      # formatting hook -- do not add tekwizely/pre-commit-golang alongside it.
      - id: golangci-lint-fmt

  - repo: https://github.com/semgrep/semgrep
    rev: v1.176.0
    hooks:
      - id: semgrep
        # --error because semgrep exits 0 on findings by default, which would
        # make this gate decorative. pass_filenames: false because pre-commit
        # hands hooks explicit paths, and explicit paths make semgrep bypass
        # its own default excludes (notably *_test.go) -- reporting findings CI
        # never sees.
        args: ["--config", "auto", "--error"]
        pass_filenames: false
